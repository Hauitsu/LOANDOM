            <div class="sk-row"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div>

          <div class="sk-card">

    <div id="overlay"></div>

    <noscript>
      <div style="max-width: 560px; margin: 80px auto; padding: 24px; border: 1px solid #232c3d; border-radius: 14px; font-family: system-ui; color: #e9edf6; background: #131822">
        <h1 style="font-size: 18px; margin-bottom: 8px">JavaScript is required</h1>
        <p style="color: #8590a6; font-size: 13px">
          LOANDOM is a static app that reads and writes a Google Sheet. Enable JavaScript and reload the page.
        </p>
      </div>
    </noscript>

    <script>
      /* Paint the last view before the ES modules arrive, so a reload shows the
         real board instead of a loading state. The app re-renders over it a
         moment later; if the build, route or week do not match, the skeleton
         stays. Bump data-build on <html> when the shell markup changes. */
      (function () {
        try {
          var raw = localStorage.getItem('loandom.boot.v1');
          if (!raw) return;
          var saved = JSON.parse(raw);
          if (!saved || !saved.views || !saved.at) return;
          if (saved.build !== document.documentElement.getAttribute('data-build')) return;
          if (Date.now() - saved.at > 12 * 60 * 60 * 1000) return;

          var route = location.hash.replace(/^#\/?/, '').split('/')[0] || 'board';
          var urlWeek = new URLSearchParams(location.search).get('w') || '';
          var sameWeek = !urlWeek || urlWeek === saved.week;
          var cachedView = saved.views[route];

          var put = function (id, html) {
            if (!html) return;
            var el = document.getElementById(id);
            if (el) el.innerHTML = html;
          };

          put('nav', saved.nav);
          put('sync-pill', saved.pill);
          if (sameWeek) {
            put('weeknav', saved.weeknav);
            put('totals', saved.totals);
          }
          if (sameWeek && cachedView) {
            put('view', cachedView);
            document.documentElement.setAttribute('data-restored', '1');
          }
        } catch (error) {
          /* private mode or a corrupt cache: the skeleton stays */
        }
      })();
    </script>

    <script type="module" src="assets/js/app.js"></script>

    <script>
      /* Registered during parse, not on load: the cache starts warming while
         the page is still being parsed. A new worker that takes over an
         already-controlled page is an update; the first claim is not. */
      if ('serviceWorker' in navigator) {
        var loandomControlled = Boolean(navigator.serviceWorker.controller);
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!loandomControlled) {
            loandomControlled = true;
            return;
          }
          window.__loandomUpdate = true;
          window.dispatchEvent(new Event('loandom:update'));
        });
        navigator.serviceWorker.addEventListener('message', function (event) {
          if (event.data && event.data.type === 'shell-updated') {
            window.__loandomUpdate = true;
            window.dispatchEvent(new Event('loandom:update'));
          }
        });
        navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function () {});
      }
    </script>
