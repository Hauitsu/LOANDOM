<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>LOANDOM — roster rename (one-time)</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; padding: 32px 20px; background: #0a0c11; color: #e9edf6; font: 14px/1.5 system-ui, sans-serif; }
      main { max-width: 860px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 6px; }
      p { color: #8590a6; margin: 0 0 16px; }
      table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #232c3d; }
      th { color: #8590a6; font-size: 10px; text-transform: uppercase; letter-spacing: .1em; }
      td.num { text-align: right; font-variant-numeric: tabular-nums; }
      .ok { color: #3ddc97; }
      .skip { color: #8590a6; }
      .miss { color: #f0554f; }
      button { height: 38px; padding: 0 16px; border-radius: 9px; border: 1px solid #c9962c; background: linear-gradient(180deg,#f0c35b,#d9a63a); color: #151208; font-weight: 650; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      pre { background: #131822; border: 1px solid #232c3d; border-radius: 10px; padding: 12px; overflow: auto; color: #b6bfd0; }
      .row { display: flex; gap: 10px; align-items: center; margin: 16px 0; }
      .pill { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; border: 1px solid #232c3d; }
    </style>
  </head>
  <body>
    <main>
      <h1>Roster rename — one-time</h1>
      <p>
        Uses the endpoint, read key and PIN already saved by the LOANDOM app in this browser.
        No requests to lostark.bible. Only renames existing rows; never creates characters.
      </p>
      <div class="row">
        <button id="refresh">Refresh preview</button>
        <button id="apply" disabled>Apply</button>
        <span id="state" class="pill">loading</span>
      </div>
      <table id="out">
        <thead><tr><th>Owner</th><th>From</th><th>To</th><th>iLvl</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>
      <pre id="log">Reading snapshot…</pre>
    </main>

    <script type="module">
      const MAP = [
        { from: 'cafra', to: 'Cafra', ilvl: 1751.67 },
        { from: 'secil', to: 'Shechil', ilvl: 1755.83 },
        { from: 'secil2', to: 'Shechiil', ilvl: 1733.33 },
        { from: 'hyun', to: 'Hyünwoo', ilvl: 1750.83 },
        { from: 'pelts', to: 'Feltz', ilvl: 1750.83 },
        { from: 'eur', to: 'Euir', ilvl: 1770.83 },
        { from: 'pap', to: 'Vaif', ilvl: 1750 },
        { from: 'nur', to: 'Elnour', ilvl: 1750 },
        { from: 'tayori', to: 'Tayori', ilvl: 1770.83 },
        { from: 'frian', to: 'Friann', ilvl: 1750 },
        { from: 'maung', to: 'Suramaung', ilvl: 1732.5 },
        { from: 'suki', to: 'Witsuki', ilvl: 1751.67 },
        { from: 'sua', to: 'Witsua', ilvl: 1750.83 },
        { from: 'boncel', to: 'Bouncel', ilvl: 1750 },
        { from: 'susu', to: 'Witsusu', ilvl: 1750 },
        { from: 'nol2', to: 'Noldua', ilvl: 1750 },
        { from: 'wisun', to: 'Witsune', ilvl: 1771.67 },
      ];

      const settings = JSON.parse(localStorage.getItem('loandom.settings.v1') || '{}');
      const log = document.getElementById('log');
      const stateEl = document.getElementById('state');
      const applyBtn = document.getElementById('apply');
      const tbody = document.querySelector('#out tbody');

      let snapshot = null;
      let plan = [];

      async function api(body) {
        const res = await fetch(settings.endpoint, {
          method: 'POST',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(body),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        if (json.ok === false) throw new Error(json.code + ': ' + json.message);
        return json;
      }

      function setState(text, kind) {
        stateEl.textContent = text;
        stateEl.style.borderColor = kind === 'ok' ? '#3ddc97' : kind === 'err' ? '#f0554f' : '#232c3d';
      }

      function render() {
        tbody.innerHTML = plan
          .map(
            (p) =>
              `<tr><td>${p.owner || '—'}</td><td class="skip">${p.from}</td><td>${p.to}</td>` +
              `<td class="num">${p.ilvl}</td><td class="${p.status === 'update' ? 'ok' : p.status === 'missing' ? 'miss' : 'skip'}">${p.status}</td></tr>`,
          )
          .join('');
        const updates = plan.filter((p) => p.status === 'update');
        applyBtn.disabled = updates.length === 0;
        applyBtn.textContent = `Apply ${updates.length} change${updates.length === 1 ? '' : 's'}`;
        setState(updates.length ? updates.length + ' ready' : 'nothing to do', updates.length ? 'ok' : '');
      }

      async function load() {
        log.textContent = 'Reading snapshot…';
        setState('loading');
        const snap = await api({ op: 'snapshot', key: settings.readKey || '' });
        snapshot = snap.data || snap;
        const characters = snapshot.characters || [];
        const players = snapshot.players || [];
        const ownerOf = (id) => (players.find((p) => p.id === id) || {}).name || '—';
        plan = MAP.map((m) => {
          const char = characters.find((c) => String(c.name || '').trim().toLowerCase() === m.from);
          if (!char) return { ...m, status: 'missing' };
          const unchanged = char.name === m.to && Number(char.ilvl) === m.ilvl;
          return { ...m, char, owner: ownerOf(char.playerId), status: unchanged ? 'unchanged' : 'update' };
        });
        render();
        log.textContent =
          `Sheet revision ${snap.revision}\n` +
          `${characters.length} characters, ${(snapshot.assignments || []).length} assignments\n` +
          plan.map((p) => `${p.from.padEnd(8)} -> ${p.to.padEnd(12)} ${p.ilvl}  [${p.status}]`).join('\n');
      }

      async function apply() {
        const updates = plan.filter((p) => p.status === 'update' && p.char);
        if (!updates.length) return;
        applyBtn.disabled = true;
        setState('applying');
        log.textContent = 'Applying…';
        const byId = new Map(updates.map((p) => [p.char.id, p]));
        const ops = updates.map((p) => ({
          type: 'character.upsert',
          character: { ...p.char, name: p.to, ilvl: p.ilvl },
        }));

        // Keep the Assignments tab names in sync for current/future rows.
        (snapshot.assignments || []).forEach((a) => {
          const hit = byId.get(a.characterId);
          if (!hit) return;
          ops.push({ type: 'cell.set', runId: a.runId, playerId: a.playerId, characterId: a.characterId, name: hit.to });
        });

        const result = await api({ op: 'mutate', pin: settings.pin || '', ops });
        setState('done', 'ok');
        log.textContent = `Applied ${result.applied} operations.\nRevision ${result.revision}.\nReload the app board to see the new names.`;
        plan = plan.map((p) => (p.status === 'update' ? { ...p, status: 'done' } : p));
        render();
      }

      document.getElementById('refresh').addEventListener('click', () => load().catch((e) => (log.textContent = String(e.message || e), setState('error', 'err'))));
      applyBtn.addEventListener('click', () => apply().catch((e) => (log.textContent = String(e.message || e), setState('error', 'err'))));

      if (!settings.endpoint) {
        log.textContent = 'No endpoint in localStorage. Open the connected LOANDOM app in this browser first.';
        setState('no endpoint', 'err');
      } else {
        load().catch((e) => (log.textContent = String(e.message || e), setState('error', 'err')));
      }
    </script>
  </body>
</html>
